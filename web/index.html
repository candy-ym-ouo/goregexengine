<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GoRegexEngine</title><style>body{font:16px system-ui;max-width:1000px;margin:2rem auto;padding:0 1rem;background:#f6f7fb;color:#202534}main{background:white;padding:1.5rem;border-radius:12px;box-shadow:0 2px 12px #0001}input,textarea{width:100%;box-sizing:border-box;margin:.4rem 0 1rem;padding:.6rem;border:1px solid #ccd;border-radius:6px}textarea{min-height:120px}button{padding:.55rem 1rem;margin-right:.5rem;border:0;border-radius:6px;background:#2856d8;color:white;cursor:pointer}pre{background:#101522;color:#d8e2ff;padding:1rem;overflow:auto}mark{background:#ffe27a}</style></head><body><main><h1>Go 正则表达式引擎</h1><label>正则表达式</label><input id="pattern" value="(\\w+)\\s+\\1"><label>标志 <input id="flags" placeholder="ims"></label><label>测试文本</label><textarea id="text">hello hello\nworld</textarea><p><button onclick="match()">编译并匹配</button><button onclick="ast()">查看 AST</button><button onclick="nfa()">查看 NFA</button></p><div id="out"></div><pre id="view"></pre></main><script>async function call(path){const q={pattern:pattern.value,flags:flags.value,text:text.value};const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(q)});return r.json()}function show(x){out.innerHTML=x.error?'<p style="color:#c22">'+x.error.message+'</p>':JSON.stringify(x,null,2)}async function match(){show(await call('/api/match'))}async function ast(){const x=await call('/api/ast');view.textContent=x.tree||x.error?.message||''}async function nfa(){const x=await call('/api/nfa');view.textContent=x.nfa?.dot||x.error?.message||''}</script></body></html>
